.lockbox h2{margin:0 0 6px;font-size:20px}.lockbox p{margin:0 0 16px;color:var(--mut);font-size:14px}
.lockbox input{width:100%;font-size:28px;letter-spacing:4px;text-align:center;padding:12px;border-radius:12px;border:1px solid var(--line);background:var(--card);color:var(--ink);user-select:text}

.lockbox .err{color:var(--r);min-height:20px;margin-top:10px;font-size:14px}
.lockbox code{display:block;word-break:break-all;user-select:text;font-size:12px;margin-top:12px;color:var(--ink)}

/* tilføj-vindue: mode 'cat' | 'art' | 'var' (nm = artiklen) – ændrer kun kladden; gemmes først med Gem */
function cusDlg(mode,nm){
 const p=$('#panel');p.style.display='flex';
 const arts=catArticles(),cur=mode==='var'?arts.find(a=>a[0]===nm):null;
 const sizesAll=mode==='var'?(cur?cur[1]:[]):arts.flatMap(a=>a[1]);
 const uq=a=>[...new Set(a.filter(Boolean))],low=x=>String(x||'').toLowerCase();
 const dl=(id,a)=>`<datalist id="${id}">${a.map(x=>`<option value="${escH(x)}">`).join('')}</datalist>`;
 const close=()=>{p.style.display='none';p.innerHTML=''};
 const finish=()=>{close();if(mode==='cat')screenCats();else if(mode==='art')screenArt();else{const c=catArticles().find(a=>a[0]===nm);if(c)screenVar(nm,c[1]);else screenArt()}};
 const title={cat:t2('eaddcat'),art:t2('addart'),var:t2('addvar')}[mode];
 const draw=msg=>{
  p.innerHTML=`<div class="pcard cus"><div class="row2"><h3>${title}</h3><button class="backbtn" id="cx">${t('close')}</button></div>`+
   `<label>${t2('cname')}</label><input id="cn" class="search" ${mode==='var'?'list="dl1"':''} maxlength="40" autocomplete="off">`+
   (mode==='cat'?`<label>${t2('cemoji')}</label><input id="ci" class="search" maxlength="8" autocomplete="off">`
    :mode==='var'?`<label>${t2('csize')}</label><input id="cs" class="search" list="dl2" maxlength="40" autocomplete="off">${dl('dl1',uq(sizesAll.map(e=>e[0])))}${dl('dl2',uq(sizesAll.map(e=>e[1])))}`
    :`<label>${t2('cvars')}</label><textarea id="cv" class="search" rows="4"></textarea>`)+
   `<div class="err" id="ce">${msg||''}</div><button class="mmbtn on" id="csv" style="width:100%">${t2('csave')}</button></div>`;
  $('#cx').onclick=close;
  $('#csv').onclick=()=>{
   const n=cleanTxt($('#cn').value);
   if(!n)return draw(t2('creq'));
   if(mode==='var'){const s2=cleanTxt($('#cs').value);
    if(sizesAll.some(e=>low(e[0])===low(n)&&low(e[1])===low(s2)))return draw(t2('cdup'));
    const e=[n,s2,'','',''],ca=cusArt(nm);if(ca)ca.v.push(e);else CUS.vars.push({d:dept,c:cat,a:nm,e});
   }else if(mode==='art'){
    if(low(n)==='andet'||arts.some(a=>low(a[0])===low(n)))return draw(t2('cdup'));
    const v=[],seen={};($('#cv').value||'').split('\n').forEach(l=>{const i=l.indexOf(','),a=cleanTxt(i<0?l:l.slice(0,i)),b=i<0?'':cleanTxt(l.slice(i+1));
      if(a&&!seen[low(a)+'|'+low(b)]){seen[low(a)+'|'+low(b)]=1;v.push([a,b,'','',''])}});
    CUS.arts.push({d:dept,c:cat,n,v});
   }else{
    const taken=(DEPT_CATS[dept]||[]).map(([k])=>low(t(k))).concat(cusCats().map(x=>low(x.n)),['andet']);
    if(taken.includes(low(n))||/^(cat_|r_|a_|v_|g_)/i.test(n))return draw(t2('cdup'));
    CUS.cats.push({d:dept,n,ic:Array.from(cleanTxt($('#ci').value)).slice(0,3).join('')||'🏷️'});
   }
   finish()};
 };
 draw();setTimeout(()=>{const i=$('#cn');if(i)i.focus()},50);
}
function cusBackup(){
 const p=$('#panel');p.style.display='flex';
 p.innerHTML=`<div class="pcard cus"><div class="row2"><h3>💾 ${t2('cbak')}</h3><button class="backbtn" id="cx">${t('close')}</button></div><p class="qhint">${t2('cbakhint')}</p><textarea id="cb" class="search" rows="6">${escH(JSON.stringify(CUS))}</textarea><div style="display:flex;gap:8px;margin-bottom:6px"><button class="mmbtn on" id="cc" style="flex:1">📋 ${t2('ccopy')}</button>${navigator.share?`<button class="mmbtn" id="cshr" style="flex:1">⤴ ${t2('cshare')}</button>`:''}</div><div class="err" id="ce"></div><button class="mmbtn" id="cl" style="width:100%">${t2('cload')}</button></div>`;
 const close=()=>{p.style.display='none';p.innerHTML=''};$('#cx').onclick=close;
 const ta=$('#cb');
 $('#cc').onclick=async()=>{let ok=false;try{await navigator.clipboard.writeText(ta.value);ok=true}catch(e){try{ta.focus();ta.select();ta.setSelectionRange(0,ta.value.length);ok=document.execCommand('copy')}catch(e2){}}
  const b=$('#cc');if(ok){b.textContent=t2('ccopied');feedback('ok')}else{ta.focus();ta.select()}};
 const sh=$('#cshr');if(sh)sh.onclick=()=>{try{navigator.share({title:'Kassation – katalog',text:ta.value}).catch(()=>{})}catch(e){}};
 $('#cl').onclick=()=>{try{const x=JSON.parse($('#cb').value),E=e=>[0,1,2,3,4].map(i=>cleanTxt((e||[])[i]));
  if(!x||!Array.isArray(x.arts)||!Array.isArray(x.vars))throw 0;
  CUS={arts:x.arts.filter(a=>a&&a.n).map(a=>({d:cleanTxt(a.d),c:cleanTxt(a.c),n:cleanTxt(a.n),v:(Array.isArray(a.v)?a.v:[]).map(E)})),
       vars:x.vars.filter(a=>a&&a.a).map(a=>({d:cleanTxt(a.d),c:cleanTxt(a.c),a:String(a.a).slice(0,80),e:E(a.e)})),
       cats:(Array.isArray(x.cats)?x.cats:[]).filter(a=>a&&a.n).map(a=>({d:cleanTxt(a.d),n:cleanTxt(a.n),ic:Array.from(cleanTxt(a.ic)).slice(0,3).join('')||'🏷️'}))};
  close();screenCats()}catch(e){$('#ce').textContent=t2('cbad')}};
}

draw('');$('#sr').oninput=e=>draw(e.target.value);

{const only=G?sizes.filter(e=>G[grpIdx(G,e)][0]===grp):sizes;

 if(editMode&&ownK.has(ek(e)))xBadge(b,()=>{const o=cusVarList(nm).find(o=>ek(o.e)===ek(e));if(o)o.rm();const c=catArticles().find(a=>a[0]===nm);if(c)screenVar(nm,c[1]);else screenArt()})});
if(editMode){if(few)plusTile(g,vsz,t2('addvar'),()=>cusDlg('var',nm));else{const pb=document.createElement('button');pb.className='addtile';pb.textContent=t2('addvar');pb.onclick=()=>cusDlg('var',nm);g.appendChild(pb)}}

function refThumb(btn,k){
  const key=k+'|'+cat,c=refCands(k);
  if(_refUrl[key]==='')return; // vi ved, der ikke er noget billede: behold kameraet
  const im=new Image();im.alt='';im.decoding='async';let i=0;
  im.onload=()=>{_refUrl[key]=im.src;btn.textContent='';btn.appendChild(im);const m=document.createElement('span');m.className='mag';m.textContent='🔍';btn.appendChild(m)};
  im.onerror=()=>{i++;if(i<c.length){im.src=c[i]}else _refUrl[key]=''};
  im.src=_refUrl[key]||c[0];
}
function showRef(k,ic){

let todayByReason={};
async function refreshToday(){ // dagens tal for egen afdeling (denne iPad)
  try{
    const rows=await window.KassationQueue.getAllRecords(3000);
    const d0=new Date();d0.setHours(0,0,0,0);const dn=dept?deptName(dept):null;
    const mine=rows.filter(r=>r.ts>=d0.getTime()&&(!dn||r.department===dn));
    todayCount=mine.reduce((a,r)=>a+Qn(r),0);const c={};
    mine.forEach(r=>String(r.reason||'').split(';').filter(Boolean).forEach(k=>{c[k]=(c[k]||0)+Qn(r)}));
    todayByReason=c;
  }catch(e){}
  renderHeader();drawDbar();
}
function drawDbar(){
  const el=document.getElementById('dbar');if(!el)return;
  const fc=document.getElementById('f-count');if(fc)fc.style.visibility=dept?'hidden':'visible'; // tallet vises i bjælken, når en afdeling er valgt
  if(!dept){el.style.display='none';return}
  el.style.display='flex';
  const items=Object.entries(todayByReason).sort((a,b)=>b[1]-a[1]);
  el.innerHTML=`<b>${t2('today')}${dept?' · '+deptName(dept):''}: ${todayCount} ${t2('pcs')}</b>`+items.map(([k,n])=>`<span>${rl(k)}: <i>${n}</i></span>`).join('');
}
const WARN1=30*60000,WARN2=120*60000; // gul efter 30 min., rød efter 2 timer uden afsendelse
async function checkWarn(){
  const el=document.getElementById('syncwarn');if(!el)return;
  try{
    const p=await window.KassationQueue.getPending();
    if(!p.length){el.innerHTML='';return}
    const age=Date.now()-Math.min(...p.map(r=>r.ts));
    if(age<WARN1){el.innerHTML='';return}
    const m=Math.floor(age/60000),a=m<60?m+' '+t2('min'):Math.floor(m/60)+' '+t2('hr');
    el.innerHTML=`<div class="syncwarn ${age>=WARN2?'sw2':'sw1'}">⚠ ${t2('warn').replace('{n}',p.length).replace('{a}',a)}</div>`;
  }catch(e){}
}
setInterval(checkWarn,30000);
function shrinkPhoto(file){ // formindsker billedet (maks. 1000 px, JPEG) så det er hurtigt at gemme og sende
  return new Promise((res,rej)=>{
    const img=new Image(),u=URL.createObjectURL(file);
    img.onload=()=>{const k=Math.min(1,1000/Math.max(img.width,img.height));const c=document.createElement('canvas');c.width=Math.round(img.width*k);c.height=Math.round(img.height*k);c.getContext('2d').drawImage(img,0,0,c.width,c.height);URL.revokeObjectURL(u);res(c.toDataURL('image/jpeg',0.7))};
    img.onerror=()=>{URL.revokeObjectURL(u);rej(new Error('img'))};img.src=u;
  });
}
const isTouch=()=>window.matchMedia&&matchMedia('(pointer:coarse)').matches;
function pickPhoto(){ // iPad/tablet/telefon: åbner kameraet direkte. Computer: live kamera i en lille visning (ellers filvælger).
  return new Promise(res=>{
    const viaFile=()=>{const i=document.createElement('input');i.type='file';i.accept='image/*';i.setAttribute('capture','environment');i.style.display='none';document.body.appendChild(i);
      i.onchange=async()=>{const f=i.files&&i.files[0];i.remove();if(!f){res('');return}try{res(await shrinkPhoto(f))}catch(e){res('')}};
      i.addEventListener('cancel',()=>{i.remove();res('')});i.click()};
    if(isTouch()||!navigator.mediaDevices||!navigator.mediaDevices.getUserMedia){viaFile();return}
    const o=document.createElement('div');o.className='refov';o.style.zIndex=9500;
    o.innerHTML=`<div class="refcard"><video id="cv" autoplay playsinline muted style="width:100%;max-height:60vh;border-radius:12px;background:#000"></video><div style="display:flex;gap:10px;margin-top:12px"><button class="backbtn" id="cx" style="flex:1">${t2('cancel')}</button><button class="btn" id="cs" style="flex:2">📷 ${t2('photo')}</button></div></div>`;
    document.body.appendChild(o);let stream=null;
    const done=v=>{if(stream)stream.getTracks().forEach(x=>x.stop());o.remove();res(v)};
    o.querySelector('#cx').onclick=()=>done('');
    navigator.mediaDevices.getUserMedia({video:{facingMode:'environment'},audio:false}).then(st=>{stream=st;const v=o.querySelector('#cv');v.srcObject=st;
      o.querySelector('#cs').onclick=()=>{const k=Math.min(1,1000/Math.max(v.videoWidth,v.videoHeight));const c=document.createElement('canvas');c.width=Math.round(v.videoWidth*k);c.height=Math.round(v.videoHeight*k);c.getContext('2d').drawImage(v,0,0,c.width,c.height);done(c.toDataURL('image/jpeg',0.7))}
    }).catch(()=>{o.remove();viaFile()});
  });
}

const rec={ts:Date.now(),cid:(window.crypto&&crypto.randomUUID)?crypto.randomUUID():Date.now().toString(36)+Math.random().toString(36).slice(2,10),lang,department:deptName(dept),dk:dept,test:isTestDept(dept),category:cat,article:art,variant:(size&&size[0])||'',size:(size&&size[1])||'',dimension:(size&&size[2])||'',color:(size&&size[3])||'',customer:(size&&size[4])||'',reason:reasonKey,...(qtyNext>1?{qty:qtyNext}:{}),...(extra||{})};
const qSaved=qtyNext;qtyNext=1; // antal gælder kun én registrering
const rid=await window.KassationQueue.addRecord(rec);
feedback('ok');
refreshToday();
window.KassationSync.flushQueue();setTimeout(()=>window.KassationSync.flushQueue(),4300);
const msg=`✓ ${t(cat)} · ${tArt(art)}${size&&size.length?' · '+entryLabel(size):''} · ${rl(reasonKey)}${qSaved>1?' · ×'+qSaved:''}`;
if(curArt&&curArt.andet||lockedSize||singleArt())screenReason();else if(curArt)screenVar(curArt.nm,curArt.sizes,curArt.grp);else screenArt(); // artiklen er låst: tilbage til samme variantliste (eller årsag for Andet) - ingen ventetid
showToast(msg,async()=>{ // Fortryd: bjælken skifter med det samme; registreringen fjernes, hvis den ikke er sendt
feedback('undo');showToast('↩ '+t('undone'));
let ok=false;try{ok=await window.KassationQueue.deleteIfPending(rid)}catch(e){console.error(e)}
if(ok){refreshToday()}else{feedback('err');showToast('⚠ '+t('toolate'),null,true)}
});
}
function showToast(msg,undo,warn){ // grøn bjælke nederst (dækker kun footeren); med Fortryd i 3,5 sek.
let el=document.getElementById('toast');
if(!el){el=document.createElement('div');el.id='toast';el.style.cssText='position:fixed;left:0;right:0;bottom:0;background:var(--g);color:#06250f;padding:8px 14px;font-weight:700;font-size:15px;display:flex;align-items:center;justify-content:space-between;gap:12px;z-index:20;min-height:68px;transition:opacity .25s;padding-bottom:calc(8px + env(safe-area-inset-bottom,0px))';document.body.appendChild(el)}
el.style.background=warn?'var(--y)':'var(--g)';el.innerHTML='';
const sp=document.createElement('span');sp.textContent=msg;sp.style.cssText='overflow:hidden;text-overflow:ellipsis;white-space:nowrap;min-width:0';el.appendChild(sp);
if(undo){const b=document.createElement('button');b.textContent=t('undo');b.style.cssText='flex:none;background:#06250f;color:#e9fff0;border:0;border-radius:9px;min-width:150px;min-height:52px;padding:12px 28px;font-weight:800;font-size:20px;cursor:pointer';b.onclick=()=>{b.disabled=true;clearTimeout(window._toastTimer);try{undo()}catch(e){console.error(e)}};el.appendChild(b)}
el.style.opacity='1';el.style.pointerEvents='auto';
clearTimeout(window._toastTimer);
window._toastTimer=setTimeout(()=>{el.style.opacity='0';el.style.pointerEvents='none'},undo?3500:(warn?3000:1200));
}
window.addEventListener('kassation:synced',updatePendBadge);
window.addEventListener('kassation:synced',()=>{refreshToday();checkWarn()});
$('#histbtn').onclick=openHist;
const supportOn=()=>{const c=window.KASSATION_CONFIG||{};return !!(c.SUPPORT_EMAIL||c.SUPPORT_NAME||c.SUPPORT_PHONE)};
async function openSupport(){
const c=window.KASSATION_CONFIG||{},p=$('#panel');p.style.display='flex';
let n=0;try{n=(await window.KassationQueue.getPending()).length}catch(e){}
const diag=['v'+APP_VERSION,dept?deptName(dept):'-',lang.toUpperCase(),t2('unsent')+': '+n].join(' · ');
const mail=c.SUPPORT_EMAIL||'';
const href=mail?'mailto:'+mail+'?subject='+encodeURIComponent('Kassations-app')+'&body='+encodeURIComponent('\n\n---\n'+diag):'';
p.innerHTML=`<div class="pcard sup"><div class="row2"><h3>${t2('support')}</h3><button class="backbtn" id="lc">${t('close')}</button></div><div>${t2('supintro')}</div>
${c.SUPPORT_NAME?`<div class="who">${c.SUPPORT_NAME}</div>`:''}${c.SUPPORT_NOTE?`<div style="color:var(--mut)">${c.SUPPORT_NOTE}</div>`:''}
${mail?`<div class="mail">${mail}</div>`:''}${c.SUPPORT_PHONE?`<div class="mail">☎ ${c.SUPPORT_PHONE}</div>`:''}
<div class="btns">${mail?`<button class="mmbtn" id="cpy">${t2('copy')}</button><a class="mmbtn" href="${href}">✉ ${t2('mail')}</a>`:''}</div>
<div class="diag">${t2('diag')}: ${diag}</div></div>`;
$('#lc').onclick=()=>p.style.display='none';
const cp=$('#cpy');if(cp)cp.onclick=async()=>{try{await navigator.clipboard.writeText(mail)}catch(e){const i=document.createElement('input');i.value=mail;document.body.appendChild(i);i.select();try{document.execCommand('copy')}catch(_){}i.remove()}cp.textContent='✓ '+t2('copied');setTimeout(()=>cp.textContent=t2('copy'),1800)};
}
async function openStats(per){
const p=$('#panel');p.style.display='flex';
const dn=deptName(dept);
const rows=(await window.KassationQueue.getAllRecords(100000)).filter(r=>r.department===dn);
const now=Date.now(),d0=new Date();d0.setHours(0,0,0,0);
const from=per==='d1'?d0.getTime():per==='d7'?now-7*864e5:0;
const mine=rows.filter(r=>r.ts>=from);const c={};
mine.forEach(r=>String(r.reason||'').split(';').filter(Boolean).forEach(k=>{c[k]=(c[k]||0)+Qn(r)}));
const list=Object.entries(c).sort((a,b)=>b[1]-a[1]);const mx=list.length?list[0][1]:1;
const tabs=['d1','d7','dall'].map(k=>`<button class="mmbtn${k===per?' on':''}" data-p="${k}">${t2(k)}</button>`).join(' ');
const bars=list.length?list.map(([k,n])=>`<div class="sbar"><div class="sl">${t(k)}</div><div class="st"><div class="sf" style="width:${Math.max(4,Math.round(n/mx*100))}%"></div></div><div class="sn">${n}</div></div>`).join(''):`<p style="color:var(--mut);text-align:center;margin:28px 0">${t2('none')}</p>`;
p.innerHTML=`<div class="pcard"><div class="row2"><h3>${t2('stats')} · ${dn}</h3><button class="backbtn" id="lc">${t('close')}</button></div><div class="row2" style="justify-content:flex-start;flex-wrap:wrap">${tabs}<span style="color:var(--mut);font-size:13px;margin-left:6px">${mine.length} ${t2('tot')}</span></div>${bars}<div style="color:var(--mut);font-size:12px;margin-top:10px">${t2('devnote')}</div></div>`;
$('#lc').onclick=()=>p.style.display='none';
p.querySelectorAll('[data-p]').forEach(b=>b.onclick=()=>openStats(b.dataset.p));
}
async function openHist(){
const p=$('#panel');p.style.display='flex';
p.innerHTML=`<div class="pcard"><div class="row2"><h3>${t('logtitle')}</h3><button class="backbtn" id="lc">${t('close')}</button></div><div id="ltbl">…</div><div class="row2" style="margin-top:10px"><span></span><button class="btn" id="lex">${t('export')}</button></div></div>`;
$('#lc').onclick=()=>p.style.display='none';
const rows=await window.KassationQueue.getAllRecords(300);
const pendCount=rows.filter(r=>!r.synced).length;
const pendHtml=pendCount?`<div class="pending">${t('pending').replace('{n}',pendCount)}</div>`:'';
$('#ltbl').innerHTML=pendHtml+(rows.length?`<table><tr><th>${t('time')}</th><th>Afd.</th><th>${t('kat')}</th><th>${t('art')}</th><th>${t('var')}</th><th>${t('aars')}</th><th>${t2('qty')}</th><th>${t('synced')}</th></tr>`+
rows.map(r=>`<tr><td>${new Date(r.ts).toLocaleString()}</td><td>${r.department||''}</td><td>${t(r.category)}</td><td>${tArt(r.article)}${r.photo?' 📷':''}</td><td>${entryLabel([r.variant,r.size,r.dimension,r.color,r.customer])}</td><td>${rl(r.reason)}</td><td>${Qn(r)}</td><td>${r.test?'Test':(r.synced?t('yes'):t('no'))}</td></tr>`).join('')+`</table>`:'');
$('#lex').onclick=()=>{
const q=v=>'"'+String(v==null?'':v).replace(/"/g,'""')+'"';
const da=window.daLabel||(x=>x); // altid danske tekster i eksporten, uanset valgt sprog
const csv='Tidspunkt;Afdeling;Kategori;Artikel;Variant;Størrelse;Dimension;Farve;Kunde;Årsag;Kommentar;Foto;Antal;Sendt\n'+rows.map(r=>[new Date(r.ts).toLocaleString('da-DK'),r.department,da(r.category),r.article,r.variant,r.size,r.dimension,r.color,r.customer,da(r.reason),r.comment||'',r.photo?'Ja':'Nej',Qn(r),(r.test?'Test':(r.synced?'Ja':'Nej'))].map(q).join(';')).join('\r\n');
const blob=new Blob(['\uFEFF'+csv],{type:'text/csv;charset=utf-8'}); // BOM, så Excel viser æ, ø og å korrekt
const a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download='kasseringer.csv';a.click();
};
}

/* ---- PIN-lås ---- */
const PIN_SALT='kassation-v1:';
async function pinHash(x){const b=await crypto.subtle.digest('SHA-256',new TextEncoder().encode(PIN_SALT+x));return Array.from(new Uint8Array(b)).map(v=>v.toString(16).padStart(2,'0')).join('')}
function lsGet(k){try{return localStorage.getItem(k)}catch(e){return null}}
function lsSet(k,v){try{localStorage.setItem(k,v)}catch(e){}}
function showOv(html){let o=document.getElementById('lockov');if(!o){o=document.createElement('div');o.id='lockov';o.className='lockov';document.body.appendChild(o)}o.innerHTML='<div class="lockbox">'+html+'</div>';return o}
function pinTool(){
  const o=showOv('<h2>Lav PIN-hash</h2><p>Skriv den kode I vil bruge</p><input id="pt" type="text" autocomplete="off" autocapitalize="off" autocorrect="off" spellcheck="false"><button id="pg">Lav hash</button><code id="po"></code>');
  o.querySelector('#pg').onclick=async()=>{const v=o.querySelector('#pt').value.trim();if(!v)return;o.querySelector('#po').textContent=await pinHash(v)};
}
function startApp(){const o=document.getElementById('lockov');if(o)o.remove();render()}
async function gate(){
  if(location.hash==='#makepin'){pinTool();return}
  const H=(window.KASSATION_CONFIG&&window.KASSATION_CONFIG.PIN_HASH)||'';
  if(!H||!window.crypto||!crypto.subtle){startApp();return}
  if(lsGet('kass_ok')===H){startApp();return}
  let fails=0,until=0;
  const o=showOv('<h2>🔒 Kassationsregistrering</h2><p>Indtast adgangskode</p><input id="pi" type="password" inputmode="text" autocomplete="off" autocapitalize="off" autocorrect="off" spellcheck="false"><button id="pb">Åbn</button><div class="err" id="pe"></div>');
  const inp=o.querySelector('#pi'),err=o.querySelector('#pe');
  const go=async()=>{
    if(Date.now()<until){err.textContent='Vent lidt og prøv igen';return}
    if(await pinHash(inp.value.trim())===H){lsSet('kass_ok',H);startApp()}
    else{fails++;inp.value='';err.textContent='Forkert kode';if(fails>=5){until=Date.now()+30000;fails=0;err.textContent='For mange forsøg – vent 30 sek.'}}
  };
  o.querySelector('#pb').onclick=go;inp.onkeydown=e=>{if(e.key==='Enter')go()};inp.focus();
}
window.addEventListener('hashchange',()=>location.reload());
gate();
if('serviceWorker' in navigator){navigator.serviceWorker.register('service-worker.js');}
