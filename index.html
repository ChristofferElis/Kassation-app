<!DOCTYPE html>
<html lang="da">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
<title>Kassationsregistrering</title>
<link rel="manifest" href="manifest.json">
<meta name="theme-color" content="#10202a">
<link rel="icon" href="icon.svg">
<link rel="apple-touch-icon" href="icon.svg">
<style>
:root{--bg:#10202a;--card:#16303d;--ink:#eef4f7;--mut:#8fa9b5;--line:#234453;--acc:#00b2a9;--r:#e5544c;--y:#e6a417;--g:#36b36b;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent;user-select:none}
html,body{height:100%;margin:0}
body{background:var(--bg);color:var(--ink);font:16px/1.3 "Segoe UI",system-ui,Arial,sans-serif;display:flex;flex-direction:column}
header{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:12px 16px;flex:none;padding-top:calc(12px + env(safe-area-inset-top,0px))}
header h1{font-size:16px;margin:0}
@media(max-width:480px){header{flex-wrap:wrap;row-gap:6px}}
.hright{display:flex;gap:6px;align-items:center}
.iconbtn{background:var(--card);border:1px solid var(--line);color:var(--ink);border-radius:9px;width:38px;height:38px;font-size:17px;position:relative}
.badge{position:absolute;top:-5px;right:-5px;background:var(--y);color:#2a1d00;font-size:10px;font-weight:800;border-radius:9px;padding:1px 5px}
.langs{display:flex;gap:4px}
.langs button{background:var(--card);border:1px solid var(--line);color:var(--mut);border-radius:8px;padding:7px 8px;font-size:12px;font-weight:700}
.langs button.on{background:var(--acc);color:#04211e;border-color:var(--acc)}
.crumb{display:flex;align-items:center;gap:8px;flex-wrap:wrap;padding:0 16px 8px;color:var(--mut);font-size:13px}
.crumb b{color:var(--ink)}
.crumb a{color:var(--acc);text-decoration:underline;font-size:12px;cursor:pointer}
.net{font-size:11px;padding:2px 8px;border-radius:9px;border:1px solid var(--line)}
.net.on{color:var(--g);border-color:var(--g)}.net.off{color:var(--y);border-color:var(--y)}
main{flex:1;display:flex;flex-direction:column;padding:4px 16px 16px;overflow:auto}
.grid{display:grid;gap:12px;flex:1;align-content:start}
.g3{grid-template-columns:repeat(3,1fr)}.g2{grid-template-columns:repeat(2,1fr)}
@media(max-width:620px){.g3{grid-template-columns:repeat(2,1fr)}}
.tile{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:20px 8px;text-align:center;font-size:17px;font-weight:700;min-height:84px;display:flex;align-items:center;justify-content:center;cursor:pointer}
.grid.fill{grid-template-columns:repeat(var(--cw),1fr);align-content:stretch;grid-auto-rows:minmax(84px,1fr);min-height:0}
.grid.fill .tile{min-height:0;padding:12px}
.grid.fill .tile .ti{font-size:34px;line-height:1.3}
.tile.mid{font-size:22px}.tile.mid .ti{font-size:44px;line-height:1.3}
.tile.big{font-size:30px}.tile.big .ti{font-size:76px;line-height:1.3}
@media(max-width:620px){.grid.fill{grid-template-columns:repeat(var(--cn),1fr)}.tile.big{font-size:24px}.tile.big .ti{font-size:52px}}
.tile:active{transform:scale(.96);background:var(--acc);color:#04211e}
.reason{background:var(--card);border:2px solid var(--line);border-radius:16px;padding:22px 8px;text-align:center;font-size:18px;font-weight:700;min-height:104px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:6px;cursor:pointer}
.reason .ic{font-size:28px}
.reason{position:relative}.reason.sel{border-color:var(--acc);background:#0f3a3a}.reason.sel::after{content:"✓";position:absolute;top:6px;right:10px;color:var(--acc);font-size:20px;font-weight:800}
.mmbtn{background:var(--card);border:1px solid var(--line);color:var(--ink);border-radius:10px;padding:8px 14px;font-weight:700;font-size:14px;cursor:pointer}.mmbtn.on{background:var(--acc);color:#04211e;border-color:var(--acc)}
.savebar{position:sticky;bottom:0;padding:10px 0 4px;background:linear-gradient(transparent,var(--bg) 30%)}.savebar .btn{width:100%;font-size:18px;padding:16px}.savebar .btn:disabled{opacity:.35}
.reason:active{transform:scale(.96);border-color:var(--r);background:#3a1d1c}
.backbar{display:flex;align-items:center;gap:10px;margin-bottom:4px}
.backbtn{background:none;border:1px solid var(--line);color:var(--ink);border-radius:10px;padding:9px 14px;font-size:14px;font-weight:600;cursor:pointer}
.okbox{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:10px}
.okbox .chk{width:78px;height:78px;border-radius:50%;background:var(--g);display:flex;align-items:center;justify-content:center;font-size:38px}
.okbox .t{font-size:19px;font-weight:700}.okbox .s{color:var(--mut);font-size:13px;text-align:center;max-width:300px}
.search{width:100%;padding:12px 14px;border-radius:12px;border:1px solid var(--line);background:var(--card);color:var(--ink);font-size:15px;margin-bottom:10px}
.artrow{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:12px 14px;margin-bottom:8px}
.artrow .nm{font-weight:700;font-size:15px;margin-bottom:8px}
.sizes{display:flex;flex-wrap:wrap;gap:6px}
.sizes button{background:#0e2129;border:1px solid var(--line);color:var(--ink);border-radius:9px;padding:9px 12px;font-size:13px;font-weight:600;cursor:pointer}
.sizes button:active{background:var(--acc);color:#04211e}
.vgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:10px}
.vgrid button{background:var(--card);border:1px solid var(--line);color:var(--ink);border-radius:12px;padding:14px 8px;min-height:60px;font-size:15px;font-weight:600;cursor:pointer}
.vgrid button:active{background:var(--acc);color:#04211e}
footer{flex:none;display:flex;justify-content:space-between;align-items:center;padding:8px 16px;color:var(--mut);font-size:12px;border-top:1px solid var(--line)}
.panel{position:fixed;inset:0;background:#0b161ccc;display:flex;align-items:flex-end;z-index:10}
.pcard{background:var(--card);width:100%;max-height:82vh;border-radius:16px 16px 0 0;padding:14px 14px calc(14px + env(safe-area-inset-bottom,0px));overflow:auto}
.pcard h3{margin:0 0 8px}
table{width:100%;border-collapse:collapse;font-size:12.5px}th,td{text-align:left;padding:5px 4px;border-bottom:1px solid var(--line)}
.row2{display:flex;justify-content:space-between;align-items:center;margin-bottom:8px;gap:8px}
.btn{background:var(--acc);color:#04211e;border:0;border-radius:10px;padding:10px 16px;font-weight:700;cursor:pointer}
.pending{background:#3a2c0e;color:var(--y);border-radius:10px;padding:8px 10px;font-size:12px;margin-bottom:8px}
.warn{background:#3a1d1c;color:#f3a7a2;border-radius:10px;padding:8px 10px;font-size:12px;margin:0 16px 8px}
</style>
</head>
<body>

<div class="hright">
<div class="langs" id="langs"></div>
<button class="iconbtn" id="histbtn">☰<span class="badge" id="pendbadge" style="display:none">0</span></button>
</div>
</header>

<main id="main"></main>
<footer>
<span id="f-count"></span>
<span class="net" id="netstat"></span>
</footer>
<div id="panel" class="panel" style="display:none"></div>

function renderCrumb(){
const c=$('#crumb');
if(!dept){c.innerHTML='';return}
let html=`<b>${deptName(dept)}</b> <a id="chdept">(${t('change')})</a>`;
if(cat)html+=` · <b>${t(cat)}</b> <a id="chcat">(${t('change')})</a>`;
c.innerHTML=html;
const cd=$('#chdept');if(cd)cd.onclick=screenDept;
const cc=$('#chcat');if(cc)cc.onclick=screenCats;
}
function screenDept(){
dept=null;cat=null;art=null;size=null;renderCrumb();
const m=$('#main');
m.innerHTML=`<div class="crumb" style="padding:0 0 8px">${t('sub_dept')}</div>
<div style="font-family:'Segoe UI',system-ui,sans-serif;color:var(--mut);font-size:12px;margin:4px 0">Øst</div><div class="grid g2" id="gO"></div>
<div style="font-family:'Segoe UI',system-ui,sans-serif;color:var(--mut);font-size:12px;margin:12px 0 4px">Vest</div><div class="grid g2" id="gV"></div>`;
const gO=$('#gO'),gV=$('#gV');
DEPTS.forEach(([k,nm,reg])=>{const d=document.createElement('div');d.className='tile';d.textContent=nm;d.onclick=()=>{dept=k;screenCats()};(reg==='øst'?gO:gV).appendChild(d)});
}
function fillGrid(g,n){ // fliser fylder mere, jo færre der er; kolonner følger skærmbredden via CSS (virker også ved drejning)
g.classList.add('fill');
g.style.setProperty('--cw',n<=3?n:n===4?2:3);
g.style.setProperty('--cn',n<=2?1:2);
return n<=3?'big':n<=6?'mid':'';
}
function screenCats(){
cat=null;art=null;size=null;renderCrumb();
const m=$('#main');
m.innerHTML=`<div class="backbar"><button class="backbtn" id="b0">${t('back')}</button></div><div class="crumb" style="padding:0 0 8px">${t('sub')}</div><div class="grid g2" id="g"></div>`;
$('#b0').onclick=screenDept;
const g=$('#g');
const cats=(DEPT_CATS[dept]||[]).concat([["cat_andet","➕"]]);
// fliserne fylder mere, jo færre kategorier der er (fx 2 + Andet = tre store fliser)
const sz=fillGrid(g,cats.length);
cats.forEach(([k,ic])=>{const d=document.createElement('div');d.className='tile '+sz;d.innerHTML=`<div><span class="ti">${ic}</span><br>${t(k)}</div>`;d.onclick=()=>{cat=k;screenArt()};g.appendChild(d)});
}
function catArticles(){return ((CATALOG_BY_DEPT[dept]&&CATALOG_BY_DEPT[dept][cat]&&CATALOG_BY_DEPT[dept][cat].articles)||[])}
function screenArt(){
art=null;size=null;curArt=null;renderCrumb();
const m=$('#main');
const base=catArticles();
if(base.length>=2){
// flere artikler i kategorien: vælg først artikel (store knapper), derefter variant
m.innerHTML=`<div class="backbar"><button class="backbtn" id="b1">${t('back')}</button></div><div class="crumb" style="padding:0 0 8px">${t('choose_art')}</div><div class="grid g2" id="ag"></div>`;
$('#b1').onclick=screenCats;
const g=$('#ag');
const allA=base.concat([["Andet",[[]]]]);const asz=fillGrid(g,allA.length);
allA.forEach(([nm,sizes])=>{const d=document.createElement('div');d.className='tile '+asz;d.textContent=tArt(nm);d.onclick=()=>{if(nm==='Andet'){art=nm;size=[];curArt=null;screenReason()}else screenVar(nm,sizes)};g.appendChild(d)});
return;
}
m.innerHTML=`<div class="backbar"><button class="backbtn" id="b1">${t('back')}</button></div><input class="search" id="sr" placeholder="${t('search')}"><div id="list"></div>`;
$('#b1').onclick=screenCats;
const all=base.concat([["Andet",[[]]]]);
const draw=q=>{
const list=$('#list');list.innerHTML='';
all.filter(([nm],i)=>i===all.length-1||!q||nm.toLowerCase().includes(q.toLowerCase())||tArt(nm).toLowerCase().includes(q.toLowerCase())).forEach(([nm,sizes])=>{
const row=document.createElement('div');row.className='artrow';
row.innerHTML=`<div class="nm">${tArt(nm)}</div><div class="sizes">${sizes.map((e,i)=>`<button data-i="${i}">${entryLabel(e)}</button>`).join('')}</div>`;
row.querySelectorAll('button').forEach(b=>b.onclick=()=>{art=nm;size=sizes[+b.dataset.i];curArt=null;screenReason()});
list.appendChild(row);
});
};
draw('');$('#sr').oninput=e=>draw(e.target.value);
}
function screenVar(nm,sizes){
curArt={nm,sizes};art=null;size=null;renderCrumb();
const m=$('#main');
m.innerHTML=`<div class="backbar"><button class="backbtn" id="b1">${t('back')}</button></div><div class="crumb" style="padding:0 0 8px"><b>${tArt(nm)}</b> · ${t('choose_var')}</div><div class="vgrid" id="vg"></div>`;
$('#b1').onclick=screenArt;
const g=$('#vg');
sizes.forEach((e,i)=>{const b=document.createElement('button');b.textContent=entryLabel(e);b.onclick=()=>{art=nm;size=sizes[i];screenReason()};g.appendChild(b)});
}
let multiMode=false;
function screenReason(){
multiMode=false;
const m=$('#main');
m.innerHTML=`<div class="backbar"><button class="backbtn" id="b2">${t('back')}</button><button class="mmbtn" id="mm" style="margin-left:auto">＋ ${t('multi')}</button></div><div class="crumb" style="padding:0 0 8px"><b>${tArt(art)}</b>${size&&size.length?' · '+entryLabel(size):''} · ${t('choose_reason')}</div><div class="grid g3" id="g"></div><div class="savebar" id="sb" style="display:none"><button class="btn" id="sv" disabled>${t('save')}</button></div>`;
$('#b2').onclick=()=>{if(curArt)screenVar(curArt.nm,curArt.sizes);else screenArt()};
const g=$('#g'),sel=new Set(),sv=$('#sv');
const upd=()=>{sv.disabled=!sel.size;sv.textContent=t('save')+(sel.size?' ('+sel.size+')':'')};
$('#mm').onclick=()=>{multiMode=!multiMode;$('#mm').classList.toggle('on',multiMode);$('#sb').style.display=multiMode?'block':'none';if(!multiMode){sel.clear();g.querySelectorAll('.sel').forEach(x=>x.classList.remove('sel'));upd()}};
REASONS.forEach(([k,ic])=>{const d=document.createElement('div');d.className='reason';d.innerHTML=`<div class="ic">${ic}</div><div>${t(k)}</div>`;
d.onclick=()=>{if(!multiMode){confirmSave(k);return}if(sel.has(k)){sel.delete(k);d.classList.remove('sel')}else{sel.add(k);d.classList.add('sel')}upd()};g.appendChild(d)});
sv.onclick=()=>{if(sel.size)confirmSave(REASONS.map(r=>r[0]).filter(k=>sel.has(k)).join(';'))};
}
async function confirmSave(reasonKey){
const rec={ts:Date.now(),lang,department:deptName(dept),category:cat,article:art,variant:(size&&size[0])||'',size:(size&&size[1])||'',dimension:(size&&size[2])||'',color:(size&&size[3])||'',customer:(size&&size[4])||'',reason:reasonKey};
await window.KassationQueue.addRecord(rec);
todayCount++;renderHeader();
window.KassationSync.flushQueue();
const msg=`✓ ${t(cat)} · ${tArt(art)}${size&&size.length?' · '+entryLabel(size):''} · ${rl(reasonKey)}`;
if(curArt)screenVar(curArt.nm,curArt.sizes);else screenArt(); // tilbage til samme variantliste - ingen ventetid
showToast(msg);
}
function showToast(msg){
let el=document.getElementById('toast');
if(!el){el=document.createElement('div');el.id='toast';el.style.cssText='position:fixed;left:16px;right:16px;bottom:70px;background:var(--g);color:#06250f;padding:10px 14px;border-radius:10px;font-weight:700;font-size:13px;text-align:center;z-index:20;pointer-events:none;transition:opacity .3s';document.body.appendChild(el)}
el.textContent=msg;el.style.opacity='1';
clearTimeout(window._toastTimer);
window._toastTimer=setTimeout(()=>{el.style.opacity='0'},900);
}
window.addEventListener('kassation:synced',updatePendBadge);
$('#histbtn').onclick=openHist;
async function openHist(){
const p=$('#panel');p.style.display='flex';
p.innerHTML=`<div class="pcard"><div class="row2"><h3>${t('logtitle')}</h3><button class="backbtn" id="lc">${t('close')}</button></div><div id="ltbl">…</div><div class="row2" style="margin-top:10px"><span></span><button class="btn" id="lex">${t('export')}</button></div></div>`;
$('#lc').onclick=()=>p.style.display='none';
const rows=await window.KassationQueue.getAllRecords(300);
const pendCount=rows.filter(r=>!r.synced).length;
const pendHtml=pendCount?`<div class="pending">${t('pending').replace('{n}',pendCount)}</div>`:'';
$('#ltbl').innerHTML=pendHtml+(rows.length?`<table><tr><th>${t('time')}</th><th>Afd.</th><th>${t('kat')}</th><th>${t('art')}</th><th>${t('var')}</th><th>${t('aars')}</th><th>${t('synced')}</th></tr>`+
rows.map(r=>`<tr><td>${new Date(r.ts).toLocaleString()}</td><td>${r.department||''}</td><td>${t(r.category)}</td><td>${tArt(r.article)}</td><td>${entryLabel([r.variant,r.size,r.dimension,r.color,r.customer])}</td><td>${rl(r.reason)}</td><td>${r.synced?t('yes'):t('no')}</td></tr>`).join('')+`</table>`:'');
$('#lex').onclick=()=>{
const q=v=>'"'+String(v==null?'':v).replace(/"/g,'""')+'"';
const csv='time,department,category,article,variant,size,dimension,color,customer,reason,synced\n'+rows.map(r=>[new Date(r.ts).toISOString(),r.department,r.category,r.article,r.variant,r.size,r.dimension,r.color,r.customer,r.reason,r.synced].map(q).join(',')).join('\n');
const blob=new Blob([csv],{type:'text/csv'});
const a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download='kasseringer.csv';a.click();
};
}
function render(){renderHeader();screenDept()}
window.addEventListener('online',renderHeader);
window.addEventListener('offline',renderHeader);
render();
if('serviceWorker' in navigator){navigator.serviceWorker.register('service-worker.js');}
</script>
</body>
</html>
